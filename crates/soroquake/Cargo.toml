[package]
name = "soroquake"
description = "Stateful fuzzing and invariant testing for Soroban smart contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["report"]
# Stream campaigns to the Soroquake dashboard when SOROQUAKE_TOKEN is set.
report = ["dep:ureq"]

[dependencies]
ureq = { version = "2", features = ["json"], optional = true }
serde_json = "1"
